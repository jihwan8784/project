<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Vision — 실시간 스켈레톤 인식</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="eyebrow">Pose Vision · On-device</div>
      <h1>사람을 인식해서 스켈레톤으로 그려드립니다</h1>
      <div class="quality-row">
        <span class="quality-label">모델 정확도</span>
        <select id="qualitySelect" class="quality-select">
          <option value="lite">Lite — 빠름 (실시간에 적합)</option>
          <option value="full" selected>Full — 균형</option>
          <option value="heavy">Heavy — 정밀 (느릴 수 있음)</option>
        </select>
      </div>
      <p id="detectionStatus" aria-live="polite">사람을 찾는 중...</p>
      <button id="saveAvatarButton" type="button" disabled>스켈레톤 저장하고 아바타로 변환</button>
    </div>

    <div class="console">
      <video id="webcamVideo" autoplay muted playsinline></video>
      <canvas id="webcamCanvas"></canvas>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
