<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Vision — 실시간 스켈레톤 인식</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="app">
    <div id="welcomePanel" class="topbar welcome-panel">
      <div class="eyebrow">Pose Vision · On-device</div>
      <h1>사람을 인식해서 스켈레톤으로 그려드립니다</h1>
      <p class="welcome-copy">카메라는 버튼을 누르기 전까지 실행되지 않습니다.</p>
      <button id="startCameraButton" class="start-camera-button" type="button">카메라 켜기</button>
    </div>

    <div class="console">
      <video id="webcamVideo" autoplay muted playsinline></video>
      <canvas id="webcamCanvas"></canvas>

      <div id="cameraHud" class="camera-hud" hidden>
        <p id="detectionStatus" class="status-pill" aria-live="polite">사람을 찾는 중...</p>
        <div class="compact-toolbar">
          <button id="settingsButton" class="compact-button icon-button" type="button" aria-expanded="false" aria-label="인식 설정" title="인식 설정">⚙</button>
          <button id="saveAvatarButton" class="compact-button avatar-button" type="button" disabled>아바타</button>
          <button id="stopCameraButton" class="compact-button icon-button stop-button" type="button" disabled aria-label="카메라 종료" title="카메라 종료">■</button>
        </div>

        <section id="settingsPanel" class="settings-panel floating-settings" hidden>
          <div class="settings-heading">
            <strong>인식 설정</strong>
            <button id="closeSettingsButton" class="close-settings-button" type="button" aria-label="설정 닫기">×</button>
          </div>
        <div class="setting-row">
          <label for="qualitySelect">모델 품질</label>
          <select id="qualitySelect" class="quality-select">
            <option value="lite">Lite — 빠름</option>
            <option value="full" selected>Full — 균형</option>
            <option value="heavy">Heavy — 정밀</option>
          </select>
        </div>
        <label class="setting-row" for="smoothingRange">
          <span>흔들림 보정 <output id="smoothingValue">0.35</output></span>
          <input id="smoothingRange" type="range" min="0" max="0.8" step="0.05" value="0.35" />
        </label>
        <label class="setting-row" for="confidenceRange">
          <span>신뢰도 기준 <output id="confidenceValue">0.40</output></span>
          <input id="confidenceRange" type="range" min="0.2" max="0.8" step="0.05" value="0.4" />
        </label>
        <div class="setting-options">
          <label><input id="showSkeletonCheckbox" type="checkbox" checked /> 스켈레톤 표시</label>
          <label><input id="mirrorCameraCheckbox" type="checkbox" checked /> 좌우 반전</label>
          <label><input id="debugModeCheckbox" type="checkbox" /> 디버그 정보</label>
        </div>
        </section>
      </div>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
