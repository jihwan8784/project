<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Vision — 실시간 스켈레톤 인식</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="eyebrow">Pose Vision · On-device</div>
      <h1>사람을 인식해서 스켈레톤으로 그려드립니다</h1>
      <div class="toolbar">
        <button id="settingsButton" type="button" aria-expanded="false">설정</button>
        <button id="startCameraButton" type="button">카메라 시작</button>
        <button id="stopCameraButton" type="button" disabled>카메라 중지</button>
      </div>
      <p id="detectionStatus" aria-live="polite">사람을 찾는 중...</p>
      <button id="saveAvatarButton" type="button" disabled>스켈레톤 저장하고 아바타로 변환</button>

      <section id="settingsPanel" class="settings-panel" hidden>
        <div class="setting-row">
          <label for="qualitySelect">모델 품질</label>
          <select id="qualitySelect" class="quality-select">
            <option value="lite">Lite — 빠름</option>
            <option value="full" selected>Full — 균형</option>
            <option value="heavy">Heavy — 정밀</option>
          </select>
        </div>
        <label class="setting-row" for="smoothingRange">
          <span>흔들림 보정 <output id="smoothingValue">0.35</output></span>
          <input id="smoothingRange" type="range" min="0" max="0.8" step="0.05" value="0.35" />
        </label>
        <label class="setting-row" for="confidenceRange">
          <span>신뢰도 기준 <output id="confidenceValue">0.40</output></span>
          <input id="confidenceRange" type="range" min="0.2" max="0.8" step="0.05" value="0.4" />
        </label>
        <div class="setting-options">
          <label><input id="showSkeletonCheckbox" type="checkbox" checked /> 스켈레톤 표시</label>
          <label><input id="mirrorCameraCheckbox" type="checkbox" checked /> 좌우 반전</label>
          <label><input id="debugModeCheckbox" type="checkbox" /> 디버그 정보</label>
        </div>
      </section>
    </div>

    <div class="console">
      <video id="webcamVideo" autoplay muted playsinline></video>
      <canvas id="webcamCanvas"></canvas>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
